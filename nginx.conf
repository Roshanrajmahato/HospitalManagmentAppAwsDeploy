# Nginx Configuration for Django

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss;

    upstream django_app {
        server web:8000;
    }
	# =====================================
	# HTTP → HTTPS REDIRECT
	# =====================================

    server {
	    listen 80;
    	    server_name aidoctorpneumoniadetections.online www.aidoctorpneumoniadetections.online;

	    return 301 https://$host$request_uri;
	}

	# =====================================
	# HTTPS SERVER
	# =====================================

    server {
            listen 443 ssl;
	    server_name aidoctorpneumoniadetections.online www.aidoctorpneumoniadetections.online;

            ssl_certificate /etc/letsencrypt/live/aidoctorpneumoniadetections.online/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/aidoctorpneumoniadetections.online/privkey.pem;

            ssl_protocols TLSv1.2 TLSv1.3;

 	    charset utf-8;

        # Static files with explicit caching
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Media files
        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # All other requests go to Django
        location / {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
